name: Scrape Headless Prices
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Refresh headless prices
        run: node scripts/refresh-prices-headless.js
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet price-data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit & push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "moza-bot"
          git config user.email "bot@moza-monitor"
          git add price-data.json
          git commit -m "Auto-update price-data.json (headless) [skip ci]"
          git push
